project:
  type: website
  output-dir: _site
  pre-render: ./scripts/pre-render.py

metadata-files:
  - _generated-metadata.yml

website:
  navbar:
    left:
      - href: itinerary.qmd
        text: Itinerary

format:
  html:
    theme:
      - cosmo
      - variables.scss
    toc: true
  pdf:
    documentclass: article
    include-in-header:
      text: |
        \usepackage{pdfpages}
    geometry:
      - top=1in
      - bottom=1in
      - left=1in
      - right=1in
    number-sections: false
    fontsize: 11pt
    mainfont: Lato
